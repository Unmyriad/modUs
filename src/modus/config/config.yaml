$schema: "https://json-schema.org/draft/2020-12/schema"

title: Max-Cut Benchmark Configuration
description: Configuration for generating and solving Max-Cut problems.

type: object

properties:
  generator:
    type: object
    description: Configuration for the problem generator.
    properties:
      problem_size:
        type: integer
        description: The size of the Max-Cut problem (number of nodes in the graph).
        default: 10
        minimum: 5
        maximum: 100

      edge_probability:
        type: number
        description: The probability of an edge existing between two nodes in the graph.
        default: 0.5
        minimum: 0.0
        maximum: 1.0

      seed:
        type: integer
        description: The random seed for reproducibility.
        default: 42

  solver:
    type: object
    description: Configuration for the solvers.
    properties:
      classical_cpu:
        type: object
        description: Configuration for the classical solver running on CPU.
        properties:
          algorithm:
            type: string
            description: The algorithm to use for the solver.
            enum: ["exact", "approximate"]
            default: "approximate"

      classical_gpu:
        type: object
        description: Configuration for the classical solver running on GPU.
        properties:
          use_gpu:
            type: boolean
            description: Whether to use GPU or not.
            default: true

      qiskit_cpu:
        type: object
        description: Configuration for the Qiskit solver running on CPU.
        properties:
          backend:
            type: string
            description: The Qiskit backend to use.
            default: "qasm_simulator"
            enum: ["qasm_simulator", "statevector_simulator", "unitary_simulator"]

      qiskit_gpu:
        type: object
        description: Configuration for the Qiskit solver running on GPU.
        properties:
          use_gpu:
            type: boolean
            description: Whether to use GPU or not.
            default: true
          backend:
            type: string
            description: The Qiskit backend to use.
            default: " AerSimulator"
            enum: ["AerSimulator", "aer_simulator_statevector", "aer_simulator_unitary"]

      ibm_quantum:
        type: object
        description: Configuration for the IBM Quantum solver.
        properties:
          api_token:
            type: string
            description: The API token for IBM Quantum.
            default: "<your-ibm-quantum-api-token>"
          device:
            type: string
            description: The IBM Quantum device to use.
            default: "ibmq_qasm_simulator"
            enum: ["ibmq_qasm_simulator", "ibmq_nairobi"]

  output:
    type: object
    description: Configuration for the output settings.
    properties:
      format:
        type: string
        description: The format of the output (JSON only initially, but can be extended).
        default: "json"
        enum: ["json"]

    required: ["format"]

required:
  - generator
  - solver
  - output